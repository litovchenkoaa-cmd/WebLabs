<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список дел</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="header__title">
                <span class="header__icon">📋</span> Список дел
            </h1>
        </header>

        <main class="main">
            <form class="todo-form">
                <input type="text" class="todo-form__input" placeholder="Новый элемент списка">
                <button type="button" class="todo-form__button todo-form__button--create">Создать</button>
                <button type="button" class="todo-form__button todo-form__button--clear">Очистить всё</button>
            </form>

            <div class="controls">
                <div class="filters">
                    <a href="#" class="filter-link filter-link--active" data-filter="all">Все</a>
                    <a href="#" class="filter-link" data-filter="active">Не сделанные</a>
                    <a href="#" class="filter-link" data-filter="completed">Сделанные</a>
                </div>
                <div class="sort-controls">
                    <button type="button" class="sort-button" data-sort="name">А–Я</button>
                    <button type="button" class="sort-button" data-sort="date">По дате</button>
                </div>
            </div>

            <div class="todo-list-container">
                <ul class="todo-list"></ul>
                <div class="empty-state">Список пуст. Добавьте первое дело!</div>
            </div>
        </main>

        <footer class="footer">
            <p class="footer__text">Copyright ©</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
